name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c requirements-ci.lock -e '.[test,visual]'
      - name: Tests
        run: python -m pytest -p no:cacheprovider
      - name: Privacy scan
        run: python scripts/privacy_scan.py .

  package:
    name: Package and installed CLI smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release-gate dependencies
        run: python -m pip install -c requirements-ci.lock '.[test,visual]'
      - name: Build, inspect, and smoke the installed package offline
        run: python scripts/release_gate.py
