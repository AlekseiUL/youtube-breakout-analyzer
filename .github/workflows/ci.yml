name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test,visual]'
      - name: Tests
        run: python -m pytest -p no:cacheprovider
      - name: Privacy scan
        run: python scripts/privacy_scan.py .

  package:
    name: Package and installed CLI smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release-gate dependencies
        run: python -m pip install '.[test,visual]'
      - name: Build, inspect, and smoke the installed package offline
        run: python scripts/release_gate.py
